name: Сборка APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "app/index.html"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Собрать APK
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"

      # Логи сборки видны только после входа в аккаунт, а аннотации — всем.
      # Поэтому хвост неудачной сборки выкладываем аннотацией.
      - name: Показать ошибку сборки
        if: failure()
        run: |
          MSG=$(tail -n 60 "$RUNNER_TEMP/build.log" \
                | cut -c1-200 \
                | sed -e 's/%/%25/g' -e 's/\r//g' \
                | awk '{ printf "%s%%0A", $0 }')
          echo "::error title=Gradle::$MSG"

      - name: Выложить APK
        uses: actions/upload-artifact@v4
        with:
          name: multistopwatch-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
