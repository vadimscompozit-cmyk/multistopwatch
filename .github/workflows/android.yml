name: Сборка APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Нужно, чтобы сборка могла создать релиз и приложить к нему APK.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Собрать APK
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"

      # Логи сборки видны только после входа в аккаунт, а аннотации — всем.
      # Поэтому хвост неудачной сборки выкладываем аннотацией.
      - name: Показать ошибку сборки
        if: failure()
        run: |
          MSG=$(tail -n 60 "$RUNNER_TEMP/build.log" \
                | cut -c1-200 \
                | sed -e 's/%/%25/g' -e 's/\r//g' \
                | awk '{ printf "%s%%0A", $0 }')
          echo "::error title=Gradle::$MSG"

      - name: Выложить APK
        uses: actions/upload-artifact@v4
        with:
          name: multistopwatch-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Файлы релиза качаются без входа в аккаунт и не истекают,
      # в отличие от артефакта сборки выше.
      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk multistopwatch.apk

          cat > notes.md <<'NOTES'
          Мультисекундомер — сколько угодно секундомеров в одной сессии,
          круги с комментариями, архив сессий и выгрузка в Excel одной таблицей.

          ## Установка

          1. Скачайте `multistopwatch.apk` ниже — можно прямо на телефоне.
          2. Откройте файл и разрешите установку из этого источника.

          Нужен Android 10 или новее. Приложение работает офлайн и не
          запрашивает доступ в интернет: страница, шрифты и генератор `.xlsx`
          лежат внутри. Замеры хранятся в памяти телефона и переживают
          перезагрузку; запущенный секундомер продолжает считать, пока
          приложение закрыто.

          ## Постоянная ссылка

          Всегда указывает на свежую версию:

          https://github.com/vadimscompozit-cmyk/multistopwatch/releases/latest/download/multistopwatch.apk
          NOTES

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" multistopwatch.apk --clobber
          else
            gh release create "$TAG" multistopwatch.apk \
              --title "Мультисекундомер $TAG" \
              --notes-file notes.md
          fi
