plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sasin.multistopwatch'
    compileSdk 34

    defaultConfig {
        applicationId "com.sasin.multistopwatch"
        // MediaStore.Downloads, через который сохраняется .xlsx, доступен с API 29
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
